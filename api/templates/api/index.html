<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 100%;
            max-width: 580px;
            background: #ffffff;
            padding: 36px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .form-header p {
            margin-top: 6px;
            margin-bottom: 0;
            font-size: 14px;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2064748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        .form-group textarea {
            min-height: 85px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-group select:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
            cursor: not-allowed;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        }

        #submitButton {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        #submitButton:hover {
            background: #1d4ed8;
        }

        #submitButton:active {
            transform: scale(0.99);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .success-icon { background: #dcfce7; color: #16a34a; }
        .error-icon { background: #fee2e2; color: #dc2626; }

        .modal-content h2 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #0f172a;
        }

        .modal-content p {
            margin: 0 0 18px;
            font-size: 14px;
            color: #64748b;
        }

        #modalButton {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="form-container">
    <div class="form-header">
        <h1>Location Details</h1>
        <p>Enter your details and select your location</p>
    </div>

    <div class="form-grid">
        <div class="form-group full-width">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group full-width">
            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter your address"></textarea>
        </div>

        <div class="form-group full-width">
            <label for="district">District</label>
            <select id="district">
                <option value="">Select District</option>
            </select>
        </div>

        <div class="form-group">
            <label for="taluk">Taluk</label>
            <select id="taluk" disabled>
                <option value="">Select Taluk</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hobli">Hobli</label>
            <select id="hobli" disabled>
                <option value="">Select Hobli</option>
            </select>
        </div>

        <div class="full-width">
            <button id="submitButton">Submit</button>
        </div>
    </div>
</div>

<div id="messageModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" class="modal-icon success-icon">✓</div>
        <h2 id="modalTitle">Success</h2>
        <p id="modalMessage">Data saved successfully.</p>
        <button id="modalButton">OK</button>
    </div>
</div>

<script>
    const nameInput = document.getElementById("name");
    const addressInput = document.getElementById("address");
    const districtDropdown = document.getElementById("district");
    const talukDropdown = document.getElementById("taluk");
    const hobliDropdown = document.getElementById("hobli");
    const submitButton = document.getElementById("submitButton");

    const messageModal = document.getElementById("messageModal");
    const modalIcon = document.getElementById("modalIcon");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const modalButton = document.getElementById("modalButton");

    function showModal(type, title, message) {
        modalTitle.textContent = title;
        modalMessage.textContent = message;

        if (type === "success") {
            modalIcon.textContent = "✓";
            modalIcon.className = "modal-icon success-icon";
        } else {
            modalIcon.textContent = "!";
            modalIcon.className = "modal-icon error-icon";
        }

        messageModal.style.display = "flex";
    }

    function closeModal() {
        messageModal.style.display = "none";
    }

    modalButton.addEventListener("click", closeModal);
    messageModal.addEventListener("click", function(event) {
        if (event.target === messageModal) closeModal();
    });

    async function loadDistricts() {
        try {
            const response = await fetch("/api/districts/");
            const data = await response.json();

            data.districts.forEach(district => {
                const option = document.createElement("option");
                option.value = district.district_id;
                option.textContent = district.district_name;
                districtDropdown.appendChild(option);
            });
        } catch (error) {
            showModal("error", "Error", "Unable to load district data.");
        }
    }

    districtDropdown.addEventListener("change", async function() {
        const districtId = this.value;

        talukDropdown.innerHTML = '<option value="">Select Taluk</option>';
        talukDropdown.disabled = true;
        hobliDropdown.innerHTML = '<option value="">Select Hobli</option>';
        hobliDropdown.disabled = true;

        if (!districtId) return;

        try {
            const response = await fetch(`/api/taluks/${districtId}/`);
            const data = await response.json();

            data.taluks.forEach(taluk => {
                const option = document.createElement("option");
                option.value = taluk.taluk_id;
                option.textContent = taluk.taluk_name;
                talukDropdown.appendChild(option);
            });

            talukDropdown.disabled = false;
        } catch (error) {
            showModal("error", "Error", "Unable to load taluk data.");
        }
    });

    talukDropdown.addEventListener("change", async function() {
        const talukId = this.value;

        hobliDropdown.innerHTML = '<option value="">Select Hobli</option>';
        hobliDropdown.disabled = true;

        if (!talukId) return;

        try {
            const response = await fetch(`/api/hoblis/${talukId}/`);
            const data = await response.json();

            data.hoblis.forEach(hobli => {
                const option = document.createElement("option");
                option.value = hobli.hobli_id;
                option.textContent = hobli.hobli_name_eng;
                hobliDropdown.appendChild(option);
            });

            hobliDropdown.disabled = false;
        } catch (error) {
            showModal("error", "Error", "Unable to load hobli data.");
        }
    });

    submitButton.addEventListener("click", async function() {
        const name = nameInput.value.trim();
        const address = addressInput.value.trim();
        const districtId = districtDropdown.value;
        const talukId = talukDropdown.value;
        const hobliId = hobliDropdown.value;

        if (!name) return showModal("error", "Required Field", "Please enter your name.");
        if (!address) return showModal("error", "Required Field", "Please enter your address.");
        if (!districtId) return showModal("error", "Required Field", "Please select a district.");
        if (!talukId) return showModal("error", "Required Field", "Please select a taluk.");
        if (!hobliId) return showModal("error", "Required Field", "Please select a hobli.");

        const requestData = {
            name: name,
            address: address,
            district_id: districtId,
            taluk_id: talukId,
            hobli_id: hobliId
        };

        submitButton.disabled = true;
        submitButton.textContent = "Saving...";

        try {
            const response = await fetch("/api/save/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            });

            const data = await response.json();

            if (response.ok) {
                showModal("success", "Success", data.message || "Data saved successfully.");
                nameInput.value = "";
                addressInput.value = "";
                districtDropdown.value = "";
                talukDropdown.innerHTML = '<option value="">Select Taluk</option>';
                talukDropdown.disabled = true;
                hobliDropdown.innerHTML = '<option value="">Select Hobli</option>';
                hobliDropdown.disabled = true;
            } else {
                showModal("error", "Unable to Save", data.message || "Failed to save data.");
            }
        } catch (error) {
            showModal("error", "Connection Error", "Unable to connect to the server. Please try again.");
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Submit";
        }
    });

    loadDistricts();
</script>

</body>
</html>
